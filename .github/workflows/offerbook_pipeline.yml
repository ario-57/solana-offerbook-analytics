name: Offerbook Data Pipeline

# Initially allow manual execution only.
# We'll enable the schedule after testing successfully.

on:
  workflow_dispatch:
    
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# Avoid running two production pipelines simultaneously.
concurrency:
  group: offerbook-production
  cancel-in-progress: false


jobs:

  offerbook-etl:

    name: Ingest, Decode and Transform

    runs-on: ubuntu-latest

    timeout-minutes: 240

    env:
      DB_TARGET: prod

      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}

      DBT_PROFILES_DIR: .github/dbt

      TOKEN_METADATA_MAX_REQUESTS: "10"
      DAILY_PRICE_MAX_REQUESTS: "50"

      INCREMENTAL_MAX_TRANSACTIONS: "20000"

      DECODE_FULL_REFRESH: "0"
      DECODE_RETRY_ERRORS: "0"
      DECODE_BATCH_SIZE: "500"
      DECODE_MAX_ROWS_PER_RUN: "20000"

      EVENT_DECODE_MAX_SIGNATURES_PER_RUN: "3000"
      EVENT_DECODE_BATCH_SIZE: "500"

    steps:

      # ==============================================
      # Job setup
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          python -c "import duckdb; print('DuckDB version:', duckdb.__version__); assert duckdb.__version__ == '1.5.5'"

      # ==============================================
      # Verify production connection
      # ==============================================

      - name: Validate configuration
        run: |
          test -n "$MOTHERDUCK_TOKEN"
          test -n "$SOLANA_RPC_URL"
          test -n "$BIRDEYE_API_KEY"

          python -m ingestion.check_db_connection
          dbt debug --target prod


      - name: Capture pipeline start time
        run: |
          echo "PIPELINE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"


      - name: Record pipeline start
        run: |
          python -u -m ingestion.log_pipeline_run start
      # ==============================================
      # Job 1: Incremental ingestion
      # ==============================================

      - name: Ingest latest Offerbook transactions
        run: |
          set -euo pipefail

          python -u -m ingestion.incremental_offerbook \
            | tee incremental.log

          if grep -q "Still missing approximately" incremental.log; then
            echo "Raw ingestion has not completed its catch-up."
            exit 1
          fi

      # ==============================================
      # Job 2: Upstream dbt models
      # ==============================================

      - name: Refresh instruction extraction
        run: |
          dbt run --target prod --select \
            "+int_offerbook_instructions" \
            "+int_offerbook_inner_instructions"

      # ==============================================
      # Job 3: Decode instructions
      # ==============================================

      - name: Decode new instructions
        run: |
          python -u -m ingestion.decode_offerbook_instructions

      # ==============================================
      # Job 4: Decode events
      # ==============================================

      - name: Decode new events
        shell: bash
        run: |
          set -euo pipefail

          max_runs=20

          for run in $(seq 1 "$max_runs"); do

            echo "================================="
            echo "Event decoding batch: $run"
            echo "================================="

            python -u -m ingestion.decode_offerbook_events \
              2>&1 | tee event_decode.log

            if grep -q "Event decoder is already up to date" event_decode.log; then
              echo "Event decoding completed successfully."
              exit 0
            fi

            remaining=$(
              sed -n \
                's/^Pending signatures remaining:[[:space:]]*//p' \
                event_decode.log \
                | tail -n 1 \
                | tr -d ',[:space:]'
            )

            if [[ ! "$remaining" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Could not read the remaining backlog."
              exit 1
            fi

            echo "Pending signatures: $remaining"

            if (( remaining == 0 )); then
              echo "All event signatures processed successfully."
              exit 0
            fi

          done

          echo "ERROR: Event backlog remains after $max_runs batches."
          exit 1
      # ==============================================
      # Job 5: Verify decoding completeness
      # ==============================================

      - name: Check processing backlog
        run: |
          python - <<'PY'
          from ingestion.db import get_connection
          from ingestion.decode_offerbook_events import (
              IDL_PATH,
              SOURCE_MODEL,
              SCAN_STATE_TABLE,
              get_idl_sha256,
          )

          con = get_connection()

          try:
              missing_instructions = con.execute("""
                  select count(*)
                  from main.int_offerbook_instructions s
                  left join decoded.offerbook_instructions d
                      on s.signature = d.signature
                      and s.instruction_index = d.instruction_index
                  where s.instruction_data is not null
                    and d.signature is null
              """).fetchone()[0]

              pending_events = con.execute(f"""
                  select count(*)
                  from (
                      select distinct i.signature
                      from {SOURCE_MODEL} i
                      left join {SCAN_STATE_TABLE} s
                          on i.signature = s.signature
                      where i.instruction_data is not null
                        and (
                            s.signature is null
                            or s.idl_sha256 is distinct from ?
                        )
                  ) pending
              """, [get_idl_sha256(IDL_PATH)]).fetchone()[0]

              print(f"Missing instructions: {missing_instructions:,}")
              print(f"Pending event signatures: {pending_events:,}")

              if missing_instructions or pending_events:
                  raise SystemExit(
                      "Decoding backlog remains. "
                      "Stopping before downstream mart refresh."
                  )
          finally:
              con.close()
          PY


      # ==============================================
      # Job 6: Refresh Offerbook Token Mints
      # ==============================================

      - name: Refresh Offerbook token mints
        run: |
          dbt run --target prod --select int_offerbook_offer_accounts

          python -u -m ingestion.extract_token_mints

      - name: Refresh Offerbook token metadata
        run: |
          python -u -m ingestion.extract_token_metadata \
            --max-requests "$TOKEN_METADATA_MAX_REQUESTS"


      
      # ==============================================
      # Job 8: Refresh Daily Token Prices
      # ==============================================

      - name: Refresh Offerbook daily token prices
        run: |
          python -u -m ingestion.extract_daily_token_prices \
            --max-requests "$DAILY_PRICE_MAX_REQUESTS"

      # ==============================================
      # Job 9: Downstream dbt transformations
      # ==============================================

      - name: Build analytics models
        run: |
          dbt run --target prod



      # ==============================================
      # Job 10: Production Observability
      # ==============================================

      - name: Report decoding quality
        run: |
          python - <<'PY'

          import os

          from ingestion.db import get_connection

          started_at = os.environ["PIPELINE_STARTED_AT"]

          con = get_connection()

          summary = [
              "## Offerbook ETL Quality Report",
              "",
              f"Pipeline started (UTC): `{started_at}`",
              "",
              "| Dataset | Status | Total records | Processed this run |",
              "|---|---|---:|---:|",
          ]

          try:

              for label, table in [
                  ("Instructions", "decoded.offerbook_instructions"),
                  ("Events", "decoded.offerbook_events"),
              ]:

                  rows = con.execute(f"""
                      select
                          decode_status,

                          count(*) as total_records,

                          count(*) filter (
                              where decoded_at >= cast(? as timestamptz)
                          ) as processed_this_run

                      from {table}

                      group by decode_status

                      order by total_records desc

                  """, [started_at]).fetchall()

                  print(f"\n{label} decoding quality:")

                  for status, total, current in rows:

                      print(
                          f"{status}: "
                          f"{total:,} total, "
                          f"{current:,} processed this run"
                      )

                      summary.append(
                          f"| {label} | {status} | "
                          f"{total:,} | {current:,} |"
                      )

              # Validate the enriched Offerbook dataset.

              total, missing = con.execute("""
                  select
                      count(*),

                      count(*) filter (
                          where collateral_decimals is null
                      )

                  from main.int_offerbook_offer_creations_enriched

              """).fetchone()

              print("\nOfferbook enrichment:")
              print(f"Total offers: {total:,}")
              print(f"Missing collateral decimals: {missing:,}")

              summary.extend([
                  "",
                  "### Enrichment quality",
                  "",
                  f"- Total offers: **{total:,}**",
                  f"- Missing collateral decimals: **{missing:,}**",
              ])

              summary_path = os.getenv("GITHUB_STEP_SUMMARY")

              if summary_path:

                  with open(
                      summary_path,
                      "a",
                      encoding="utf-8",
                  ) as file:

                      file.write(
                          "\n".join(summary) + "\n"
                      )

          finally:

              con.close()

          PY


      # ==============================================
      # Job 11: Critical Production Data Quality
      # ==============================================

      - name: Run critical dbt tests
        run: |
          dbt test --target prod \
            --select \
            stg_offerbook_decoded_instructions \
            stg_offerbook_events \
            stg_token_prices_daily \
            int_offerbook_offer_creations_enriched \
            int_offerbook_loans_enriched \
            int_offerbook_loan_repayments_enriched \
            int_offerbook_loan_defaults_enriched \
            source:offerbook_decoded.offerbook_events \
            --threads 2

      # ==============================================
      # Job 12: Record Pipeline Completion
      # ==============================================

      - name: Record pipeline completion
        if: ${{ !cancelled() }}

        env:
          PIPELINE_JOB_STATUS: ${{ job.status }}

        run: |
          python -u -m ingestion.log_pipeline_run finish