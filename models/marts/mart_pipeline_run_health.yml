version: 2

models:

  - name: mart_pipeline_run_health

    description: >
      Operational health metrics for individual
      GitHub Actions Offerbook pipeline attempts.

    columns:

      - name: github_run_id
        data_tests:
          - not_null

      - name: run_attempt
        data_tests:
          - not_null

      - name: started_at
        data_tests:
          - not_null

      - name: effective_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - running
                  - success
                  - failure
                  - cancelled
                  - stale

      - name: run_date_utc
        data_tests:
          - not_null

      - name: elapsed_minutes
        data_tests:
          - not_null