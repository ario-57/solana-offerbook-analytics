version: 2

models:
  - name: mart_offerbook_daily_activity
    description: >
      Daily Offerbook protocol activity aggregated by
      decoded instruction type.

    columns:
      - name: block_date
        description: UTC date of the Solana transaction.
        data_tests:
          - not_null

      - name: instruction_name
        description: >
          Offerbook instruction name decoded from the
          program IDL.
        data_tests:
          - not_null

      - name: instruction_count
        description: >
          Number of Offerbook instructions executed
          during the day.
        data_tests:
          - not_null

      - name: transaction_count
        description: >
          Number of distinct Solana transactions containing
          this Offerbook instruction.
        data_tests:
          - not_null

  - name: mart_offerbook_daily_lending
    description: >
      Daily Offerbook lending activity derived from
      successfully created loans.

    columns:

      - name: block_date
        data_tests:
          - not_null
          - unique

      - name: loan_count
        data_tests:
          - not_null

      - name: unique_lenders
        data_tests:
          - not_null

      - name: unique_borrowers
        data_tests:
          - not_null

      - name: unique_users
        data_tests:
          - not_null

      - name: priced_loan_count
        data_tests:
          - not_null

      - name: unpriced_loan_count
        data_tests:
          - not_null

  - name: mart_offerbook_lifecycle_overview
    description: >
      Current protocol-level Offerbook loan lifecycle snapshot.
      Includes active, repaid, defaulted, past-due and extension
      metrics, plus origination-value USD metrics.

    columns:

      - name: snapshot_at
        data_tests:
          - not_null

      - name: total_loans
        data_tests:
          - not_null

      - name: active_loans
        data_tests:
          - not_null

      - name: repaid_loans
        data_tests:
          - not_null

      - name: defaulted_loans
        data_tests:
          - not_null

      - name: closed_loans
        data_tests:
          - not_null

      - name: unique_users
        data_tests:
          - not_null

      - name: priced_loan_count
        data_tests:
          - not_null

      - name: unpriced_loan_count
        data_tests:
          - not_null

  - name: mart_offerbook_daily_lifecycle
    description: >
      Daily Offerbook lifecycle activity combining loan
      originations, repayments, defaults, point-in-time USD
      values and unique active users.

    columns:

      - name: block_date
        data_tests:
          - not_null
          - unique

      - name: originated_loans
        data_tests:
          - not_null

      - name: repaid_loans
        data_tests:
          - not_null

      - name: defaulted_loans
        data_tests:
          - not_null

      - name: unique_active_users
        data_tests:
          - not_null

  - name: mart_offerbook_daily_markets
    description: >
      Daily Offerbook market-level lending activity.
      One row represents one date and one
      principal/collateral mint pair.

    columns:

      - name: block_date
        data_tests:
          - not_null

      - name: principal_asset_key
        data_tests:
          - not_null

      - name: collateral_asset_key
        data_tests:
          - not_null

      - name: market_name
        data_tests:
          - not_null

      - name: originated_loans
        data_tests:
          - not_null

      - name: repaid_loans
        data_tests:
          - not_null

      - name: defaulted_loans
        data_tests:
          - not_null

  - name: mart_offerbook_loan_cohorts
    description: >
      Offerbook loan performance cohorts grouped by
      origination date and principal/collateral market.

    columns:

      - name: cohort_date
        data_tests:
          - not_null

      - name: market_name
        data_tests:
          - not_null

      - name: originated_loans
        data_tests:
          - not_null

      - name: active_loans
        data_tests:
          - not_null

      - name: repaid_loans
        data_tests:
          - not_null

      - name: defaulted_loans
        data_tests:
          - not_null
      - name: principal_asset_key
        data_tests:
          - not_null

      - name: collateral_asset_key
        data_tests:
          - not_null

  - name: mart_offerbook_offer_efficiency_daily
    description: >
      Offer-creation cohorts by UTC date, market and creator role.
      Measures eventual fill/cancel/expiry outcomes, capital utilization,
      and time to first fill. Recent cohorts are right-censored because
      open offers have had less time to resolve.
    columns:
      - name: block_date
        data_tests:
          - not_null

      - name: principal_asset_key
        data_tests:
          - not_null

      - name: collateral_asset_key
        data_tests:
          - not_null

      - name: creator_role
        data_tests:
          - not_null

      - name: offers_created
        data_tests:
          - not_null

      - name: offers_with_fill
        data_tests:
          - not_null

  - name: mart_offerbook_market_liquidity_snapshot
    description: >
      Current open Offerbook liquidity by market and creator role.
      Includes stale-offer counts, remaining principal liquidity,
      offer age and open APY distribution.
    columns:
      - name: snapshot_at
        data_tests:
          - not_null

      - name: principal_asset_key
        data_tests:
          - not_null

      - name: collateral_asset_key
        data_tests:
          - not_null

      - name: creator_role
        data_tests:
          - not_null

      - name: open_offers
        data_tests:
          - not_null

      - name: active_offer_creators
        data_tests:
          - not_null

  - name: mart_offerbook_daily_wallet_retention
    description: >
      Daily active Offerbook wallets split into new and returning users for
      lender, borrower and all-wallet views. A wallet is new on its first-ever
      observed Offerbook activity date for the relevant role.
    columns:
      - name: block_date
        data_tests:
          - not_null

      - name: wallet_role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - lender
                  - borrower
                  - all

      - name: active_wallets
        data_tests:
          - not_null

      - name: new_wallets
        data_tests:
          - not_null

      - name: returning_wallets
        data_tests:
          - not_null

  - name: mart_offerbook_lender_performance
    description: >
      Lifetime lender-level Offerbook performance. Includes loan count,
      contractual APY, origination volume, realized interest on repaid loans,
      default exposure and activity dates. Realized interest is not netted
      against defaulted principal or collateral received.
    columns:
      - name: wallet_address
        data_tests:
          - not_null
          - unique

      - name: originated_loans
        data_tests:
          - not_null

      - name: avg_apy_pct
        description: Loan-count-weighted mean contractual APY in percentage points.

      - name: realized_interest_usd
        description: >
          USD value of interest actually observed on repaid loans. This is
          gross realized interest, not net economic profit after defaults.

      - name: defaulted_principal_usd
        description: >
          Principal value at default event prices for loans that defaulted.
          Kept separate from realized interest rather than treated as a loss.

  - name: mart_offerbook_borrower_performance
    description: >
      Lifetime borrower-level Offerbook performance. Includes borrowing volume,
      contractual APY, realized interest paid on repaid loans, defaults,
      extensions and activity dates.
    columns:
      - name: wallet_address
        data_tests:
          - not_null
          - unique

      - name: originated_loans
        data_tests:
          - not_null

      - name: avg_apy_pct
        description: Loan-count-weighted mean contractual APY in percentage points.

      - name: realized_interest_paid_usd
        description: >
          USD value of interest actually paid on observed repayments.

      - name: defaulted_principal_usd
        description: >
          Principal value at default event prices for defaulted borrower loans.

  - name: mart_offerbook_daily_execution
    description: >
      Daily transaction-level Offerbook execution health derived from the raw
      Solana getTransaction payload. Includes compute units, fees, success rate
      and transaction-complexity measures.
    columns:
      - name: block_date
        data_tests:
          - not_null
          - unique

      - name: transactions
        data_tests:
          - not_null

      - name: successful_transactions
        data_tests:
          - not_null

      - name: failed_transactions
        data_tests:
          - not_null

      - name: total_compute_units
        description: Sum of Solana transaction-level computeUnitsConsumed.

      - name: successful_compute_units
        description: Compute units consumed by successful transactions only.

      - name: total_fee_lamports
        description: Total transaction fees in lamports.

  - name: mart_offerbook_instruction_execution_daily
    description: >
      Daily execution metrics by decoded top-level Offerbook instruction type.
      Compute units and fees are transaction-associated, not exclusively
      attributable to one instruction. A transaction containing multiple
      Offerbook instruction types can contribute to multiple rows.
    columns:
      - name: block_date
        data_tests:
          - not_null

      - name: instruction_name
        data_tests:
          - not_null

      - name: instruction_count
        data_tests:
          - not_null

      - name: transaction_count
        data_tests:
          - not_null

      - name: associated_compute_units
        description: >
          Sum of full transaction compute units for transactions containing
          this instruction type. Do not sum across instruction types.

      - name: associated_fee_lamports
        description: >
          Sum of full transaction fees for transactions containing this
          instruction type. Do not sum across instruction types.
