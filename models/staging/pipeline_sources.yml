version: 2

sources:

    - name: pipeline_monitoring
      schema: pipeline

      description: >
        Operational metadata recordeed by 
        GitHub Actions pipeline executions.

      tables:

        - name: run_history


          description: >
            One record per GitHub Actions
            workflow execution attempt.

          columns:

            - name: github_run_id
              data_tests:
                - not_null

            - name: run_attempt
              data_tests:
                - not_null

            - name: started_at
              data_tests:
                - not_null

            - name: status
              data_tests:
                - not_null
                - accepted_values:
                    arguments:
                      values:
                        - running
                        - success
                        - failure
                        - cancelled